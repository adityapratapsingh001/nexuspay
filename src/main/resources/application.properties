spring.application.name=nexus

# Database Configuration
# Primary: PostgreSQL (via Env Vars), Fallback: H2 In-Memory
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:nexuspay;DB_CLOSE_DELAY=-1}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Hibernate will detect the dialect automatically for most databases

# Encryption
encryption.key=32charslongsecretkey1234567890!!

# Logging
logging.level.com.nexuspay=DEBUG
